<!-- HEADER -->
<header class="relative bg-gradient-to-r from-emerald-600 via-teal-600 to-green-700 text-white shadow-lg overflow-hidden py-8 px-4 md:px-8">
    <!-- Trang trí họa tiết núi rừng -->
    <div class="absolute inset-0 opacity-10 pointer-events-none">
        <svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
            <path fill="#ffffff" fill-opacity="1" d="M0,192L48,197.3C96,203,192,213,288,192C384,171,480,117,576,117C672,117,768,171,864,197.3C960,224,1056,224,1152,208C1248,192,1344,160,1392,144L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
        </svg>
    </div>
    
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between relative z-10">
        <div class="text-center md:text-left mb-6 md:mb-0">
            <span class="bg-amber-400 text-slate-900 font-bold px-3 py-1 rounded-full text-xs uppercase tracking-wider shadow-sm">
                <i class="fa-solid fa-fire-burner mr-1"></i> Trại Hè 2026
            </span>
            <h1 class="text-3xl md:text-5xl font-bold mt-2 tracking-tight">CHƯƠNG TRÌNH CẮM TRẠI 2026</h1>
            <p class="text-emerald-100 mt-2 text-sm md:text-base flex items-center justify-center md:justify-start gap-2">
                <i class="fa-regular fa-calendar-days text-amber-300"></i>
                Thứ Bảy & Chúa Nhật, ngày 18 - 19 / 07 / 2026 (Dự kiến)
            </p>
        </div>
        
        <!-- Countdown Timer -->
        <div class="bg-white/10 backdrop-blur-md rounded-2xl p-4 border border-white/20 shadow-xl min-w-[280px]">
            <h3 class="text-center text-xs font-semibold text-amber-300 uppercase tracking-widest mb-2">Đếm Ngược Đến Giờ Khai Mạc</h3>
            <div class="grid grid-cols-4 gap-2 text-center">
                <div class="bg-emerald-900/40 p-2 rounded-lg">
                    <span id="days" class="block text-2xl font-bold text-white">00</span>
                    <span class="text-[10px] text-emerald-200">Ngày</span>
                </div>
                <div class="bg-emerald-900/40 p-2 rounded-lg">
                    <span id="hours" class="block text-2xl font-bold text-white">00</span>
                    <span class="text-[10px] text-emerald-200">Giờ</span>
                </div>
                <div class="bg-emerald-900/40 p-2 rounded-lg">
                    <span id="minutes" class="block text-2xl font-bold text-white">00</span>
                    <span class="text-[10px] text-emerald-200">Phút</span>
                </div>
                <div class="bg-emerald-900/40 p-2 rounded-lg">
                    <span id="seconds" class="block text-2xl font-bold text-white">00</span>
                    <span class="text-[10px] text-emerald-200">Giây</span>
                </div>
            </div>
        </div>
    </div>
</header>
